<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4in1 Watcher | 实时盯盘终端</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="/static/icon.svg">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/watcher/styles.css?v=20260917-del-fix">
    <script type="module" src="/static/watcher/app.js?v=20260917-del-fix"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="terminal-bg text-gray-100 min-h-screen font-mono" x-data="app()" x-cloak>
    <!-- 背景网格效果 -->
    <div class="fixed inset-0 pointer-events-none opacity-5">
        <div class="grid-pattern"></div>
    </div>

    <!-- 顶部导航 -->
    <nav class="nav-bar">
        <div class="flex items-center justify-between px-6 py-4">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3v18h18" stroke-linecap="round"/>
                        <path d="M7 14l4-4 4 4 5-5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight logo-text">4in1 WATCHER</h1>
                    <p class="text-xs text-gray-500 tracking-widest">REAL-TIME TERMINAL</p>
                </div>
            </div>

            <!-- 控制区 -->
            <div class="flex items-center gap-6">
                <!-- 时间显示 -->
                <div class="text-right">
                    <div class="text-2xl font-bold time-display" x-text="currentTime"></div>
                    <div class="text-xs text-gray-500">US/EASTERN</div>
                </div>

                <!-- 控制开关 -->
                <div class="flex items-center gap-2">
                    <button @click="toggleWatcher()" class="p-2 rounded hover:bg-gray-800 transition-colors" :class="watcherRunning ? 'text-emerald-400' : 'text-gray-500'" :title="watcherRunning ? '停止服务 (暂停接收数据)' : '启动服务 (恢复接收数据)'">
                        <svg x-show="watcherRunning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5" x-cloak><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                        <svg x-show="!watcherRunning" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5" x-cloak><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                    <button @click="toggleSound()" class="p-2 rounded hover:bg-gray-800 transition-colors" :class="soundEnabled ? 'text-blue-400' : 'text-gray-500'" :title="soundEnabled ? '关闭声音提示' : '开启声音提示'">
                        <svg x-show="soundEnabled" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5" x-cloak><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                        <svg x-show="!soundEnabled" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5" x-cloak><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                    </button>
                    <button @click="$refs.alertAudio.currentTime=0; $refs.alertAudio.play().catch(()=>{})" class="p-2 rounded hover:bg-gray-800 transition-colors text-gray-500 hover:text-yellow-400 text-[10px] font-mono tracking-widest" title="测试声音">TEST</button>
                </div>

                <!-- 策略提醒开关 -->
                <div class="flex items-center gap-1 border-l border-gray-800 pl-4">
                    <span class="text-[10px] text-gray-600 mr-1 tracking-widest">ALERTS</span>
                    <button
                        @click="toggleAlertSwitch('v7')"
                        :class="alertSwitches.v7 ? 'text-emerald-400 bg-emerald-400/10' : 'text-gray-600'"
                        class="px-2 py-1 rounded text-[10px] font-mono tracking-widest border transition-colors"
                        :style="alertSwitches.v7 ? 'border-color: rgba(52,211,153,0.3)' : 'border-color: rgba(75,85,99,0.3)'"
                        title="V7 策略提醒（金叉/死叉/形态）"
                    >V7</button>
                    <button
                        @click="toggleAlertSwitch('a')"
                        :class="alertSwitches.a ? 'text-blue-400 bg-blue-400/10' : 'text-gray-600'"
                        class="px-2 py-1 rounded text-[10px] font-mono tracking-widest border transition-colors"
                        :style="alertSwitches.a ? 'border-color: rgba(96,165,250,0.3)' : 'border-color: rgba(75,85,99,0.3)'"
                        title="策略A 提醒（V4 跨叉确认/回踩反弹）"
                    >A</button>
                    <button
                        @click="toggleAlertSwitch('b')"
                        :class="alertSwitches.b ? 'text-amber-400 bg-amber-400/10' : 'text-gray-600'"
                        class="px-2 py-1 rounded text-[10px] font-mono tracking-widest border transition-colors"
                        :style="alertSwitches.b ? 'border-color: rgba(251,191,36,0.3)' : 'border-color: rgba(75,85,99,0.3)'"
                        title="策略B 提醒（突破/回踩/衰竭）"
                    >B</button>
                    <button
                        @click="toggleAlertSwitch('d')"
                        :class="alertSwitches.d ? 'text-rose-400 bg-rose-400/10' : 'text-gray-600'"
                        class="px-2 py-1 rounded text-[10px] font-mono tracking-widest border transition-colors"
                        :style="alertSwitches.d ? 'border-color: rgba(251,113,133,0.3)' : 'border-color: rgba(75,85,99,0.3)'"
                        title="策略D 提醒（V4 交叉后价格破位验证）"
                    >D</button>
                    <button
                        @click="toggleAlertSwitch('e')"
                        :class="alertSwitches.e ? 'text-teal-400 bg-teal-400/10' : 'text-gray-600'"
                        class="px-2 py-1 rounded text-[10px] font-mono tracking-widest border transition-colors"
                        :style="alertSwitches.e ? 'border-color: rgba(45,212,191,0.3)' : 'border-color: rgba(75,85,99,0.3)'"
                        title="策略E 提醒（宽松 Close 锚定 + 允许回踩）"
                    >E</button>
                    <button
                        @click="toggleAlertSwitch('f')"
                        :class="alertSwitches.f ? 'text-orange-400 bg-orange-400/10' : 'text-gray-600'"
                        class="px-2 py-1 rounded text-[10px] font-mono tracking-widest border transition-colors"
                        :style="alertSwitches.f ? 'border-color: rgba(251,146,60,0.3)' : 'border-color: rgba(75,85,99,0.3)'"
                        title="策略F 提醒（V4 gap 连续扩大动量验证）"
                    >F</button>
                    <button
                        @click="toggleAlertSwitch('g')"
                        :class="alertSwitches.g ? 'text-pink-400 bg-pink-400/10' : 'text-gray-600'"
                        class="px-2 py-1 rounded text-[10px] font-mono tracking-widest border transition-colors"
                        :style="alertSwitches.g ? 'border-color: rgba(244,114,182,0.3)' : 'border-color: rgba(75,85,99,0.3)'"
                        title="策略G 提醒（EMA快速穿越 + VWAP + SMA趋势过滤）"
                    >G</button>
                    <button
                        @click="toggleAlertSwitch('h')"
                        :class="alertSwitches.h ? 'text-violet-400 bg-violet-400/10' : 'text-gray-600'"
                        class="px-2 py-1 rounded text-[10px] font-mono tracking-widest border transition-colors"
                        :style="alertSwitches.h ? 'border-color: rgba(167,139,250,0.3)' : 'border-color: rgba(75,85,99,0.3)'"
                        title="策略H 提醒（EMA9/21交叉 + 量能窗口闸 + 交叉前斜率闸 双闸）"
                    >H</button>
                    <button
                        @click="toggleAlertSwitch('c2')"
                        :class="alertSwitches.c2 ? 'text-cyan-400 bg-cyan-400/10' : 'text-gray-600'"
                        class="px-2 py-1 rounded text-[10px] font-mono tracking-widest border transition-colors"
                        :style="alertSwitches.c2 ? 'border-color: rgba(34,211,238,0.3)' : 'border-color: rgba(75,85,99,0.3)'"
                        title="策略C2 提醒（EMA+MACD+RSI V2.1，含 F2/F3/F4 过滤）"
                    >C2</button>
                    <button
                        @click="toggleAlertSwitch('c3')"
                        :class="alertSwitches.c3 ? 'text-cyan-400 bg-cyan-400/10' : 'text-gray-600'"
                        class="px-2 py-1 rounded text-[10px] font-mono tracking-widest border transition-colors"
                        :style="alertSwitches.c3 ? 'border-color: rgba(34,211,238,0.3)' : 'border-color: rgba(75,85,99,0.3)'"
                        title="策略C3 提醒（EMA+MACD+RSI V2.1 原始信号 + 5min噪音否决）"
                    >C3</button>
                    <button
                        @click="openStrategyParams()"
                        class="px-2 py-1 rounded text-gray-500 hover:text-indigo-300 hover:bg-indigo-400/10 border border-transparent hover:border-indigo-400/30 transition-colors"
                        title="策略参数设置（所有策略，实时生效+持久化）"
                    >
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-4 h-4">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>

                <!-- 卡片迷你图 MA 显隐开关 -->
                <div class="flex items-center gap-1 border-l border-gray-800 pl-4">
                    <button
                        @click="toggleMiniMA()"
                        :class="showMiniMA ? 'text-indigo-400 bg-indigo-400/10' : 'text-gray-600'"
                        class="px-2 py-1 rounded text-[10px] font-mono tracking-widest border transition-colors"
                        :style="showMiniMA ? 'border-color: rgba(129,140,248,0.3)' : 'border-color: rgba(75,85,99,0.3)'"
                        title="显示/隐藏卡片K线上的MA9/MA21均线"
                    >MA</button>
                </div>

                <!-- 连接状态 -->
                <div class="connection-indicator" :class="connected ? 'connected' : 'disconnected'">
                    <span class="pulse-dot"></span>
                    <span class="text-xs tracking-wider" x-text="connected ? 'LIVE' : 'OFFLINE'"></span>
                </div>

                <!-- 信号记录按钮 -->
                <button @click="openSignalDrawer()" class="btn-siglog">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-4 h-4">
                        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" stroke-linecap="round"/>
                        <rect x="9" y="3" width="6" height="4" rx="1"/>
                        <path d="M9 12h6M9 16h4" stroke-linecap="round"/>
                    </svg>
                    <span>SIG LOG</span>
                    <span x-show="signalUnreadCount > 0" class="siglog-badge" x-text="signalUnreadCount" x-cloak></span>
                </button>

                <!-- 事件日志按钮 -->
                <button @click="openEventLog()" class="btn-eventlog">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-4 h-4">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" stroke-linecap="round"/>
                        <path d="M13 2v7h7" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9 13h6M9 17h4" stroke-linecap="round"/>
                    </svg>
                    <span>EVENT LOG</span>
                    <span x-show="eventUnreadCount > 0" class="siglog-badge eventlog-badge" x-text="eventUnreadCount" x-cloak></span>
                </button>

                <!-- 添加 ticker -->
                <div class="flex items-center gap-2 add-ticker-box">
                    <input
                        type="text"
                        x-model="newTicker"
                        @keyup.enter="addTicker()"
                        :disabled="addingTicker"
                        placeholder="ADD TICKER"
                        class="ticker-input"
                    >
                    <button @click="addTicker()" :disabled="addingTicker" class="btn-add"
                            :title="addingTicker ? '正在补 K 线…' : '添加 Ticker'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                            <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <!-- 加票要同步等后端补完 K 线，这两条是那几秒里唯一的界面反馈 -->
                    <span x-show="addingTicker" class="add-ticker-hint" x-cloak>补 K 线…</span>
                    <span x-show="addTickerError" x-text="addTickerError"
                          class="add-ticker-error" x-cloak></span>
                </div>

                <!-- 搜索 ticker -->
                <div class="flex items-center gap-2 ml-2 border-l border-gray-800 pl-4">
                    <input
                        type="text"
                        x-model="searchQuery"
                        @keyup.enter="searchTicker()"
                        placeholder="SEARCH TICKER"
                        class="search-input"
                    >
                    <button @click="searchTicker()" class="btn-search" title="搜索并定位">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-4 h-4">
                            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 市场状态条 -->
        <div class="market-status-bar">
            <!-- SPY, QQQ, VIX 循环显示 -->
            <template x-for="info in marketInfo.slice(0, 3)" :key="info.label">
                <div class="flex items-center gap-2 px-4">
                    <span class="text-xs text-gray-500" x-text="info.label"></span>
                    <span
                        class="text-sm font-bold"
                        :class="info.change >= 0 ? 'text-emerald-400' : 'text-red-400'"
                        x-text="info.value"
                    ></span>
                </div>
            </template>
            <!-- 趋势徽章与多空比 2026-09-01 删除：它们由 market_regime 驱动，而
                 market_regime 是震荡闸 + 方向闸的展示镜像，两条闸同日下线。 -->

            <!-- UW 0DTE Market Tide 展示徽章（纯展示，不参与任何策略计算，见 market_tide_service.py） -->
            <div class="flex items-center gap-2 px-4 border-l border-gray-800 relative"
                 @mouseenter="showTidePopover()" @mouseleave="hideTidePopover()">
                <span class="text-xs text-gray-500">0DTE Tide</span>
                <span
                    class="text-sm font-bold cursor-default"
                    :class="{
                        'text-emerald-400': tideInfo()?.direction === 'bullish',
                        'text-red-400': tideInfo()?.direction === 'bearish',
                        'text-gray-400': !['bullish','bearish'].includes(tideInfo()?.direction),
                        'opacity-50': tideStale()
                    }"
                    x-text="tideInfo()?.text ?? '--'"
                ></span>
                <!-- 非盘中标出场次：昨收 / 今日收盘，盘中不显示 -->
                <span class="text-[10px] text-gray-500" x-show="tideSessionNote()"
                      x-text="tideSessionNote()"></span>
                <div x-show="_tidePopoverOpen"
                     class="absolute top-full right-0 mt-2 z-50 bg-gray-900 border border-gray-700 rounded-lg shadow-xl p-2"
                     style="width: 340px;">
                    <div class="flex items-center justify-between px-1 pb-1 text-[10px] text-gray-400">
                        <span class="font-semibold text-gray-300">0DTE 资金潮</span>
                        <div class="flex items-center gap-2">
                            <span><span class="text-emerald-400">●</span> Net Call</span>
                            <span><span class="text-red-400">●</span> Net Put</span>
                        </div>
                    </div>
                    <div id="tide-popover-chart" style="width: 100%; height: 160px;"></div>
                </div>
            </div>

            <!-- 盘中快讯滚动条：只显示后端判为最高档的消息（一天十几条）。
                 flex:1 吃掉剩余宽度，右边以后加任何徽章都会自动让位。
                 spec: docs/superpowers/specs/2026-09-05-盘中快讯滚动条-design.md -->
            <div class="news-ticker" :class="{
                    'news-untranslated': currentNews() && !currentNews().translated
                 }"
                 :title="currentNews() ? currentNews().en : ''">
                <template x-if="currentNews()">
                    <span class="news-ticker-text" :key="currentNews().ts + currentNews().en"
                          x-text="newsText(currentNews())"></span>
                </template>
            </div>

        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="p-6 relative z-10">
        <!-- 空状态 -->
        <div x-show="tickers.length === 0" class="empty-state">
            <div class="text-center">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M3 9h18M9 21V9"/>
                    </svg>
                </div>
                <p class="text-gray-500 mt-4">输入 TICKER 开始盯盘</p>
            </div>
        </div>

        <!-- 卡片网格 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3">
            <template x-for="(ticker, index) in sortedTickersList" :key="ticker.symbol">
                <div
                    :id="'card-' + ticker.symbol"
                    x-init="registerCard($el, ticker.symbol)"
                    class="ticker-card"
                    :class="{
                        'signal-bull': ticker.activeSignalDirection === 'bull' && !ticker.signalViewed,
                        'signal-bear': ticker.activeSignalDirection === 'bear' && !ticker.signalViewed,
                        'highlight-search': ticker.searchHighlighted
                    }"
                    @click="showDetail(ticker, $event)"
                >
                    <!-- 卡片头部 -->
                    <div class="card-header">
                        <div class="flex items-center gap-3">
                            <h2 class="ticker-symbol" x-text="ticker.symbol"></h2>
                            <span
                                class="price-tag"
                                :class="ticker.priceChange >= 0 ? 'positive' : 'negative'"
                                x-text="ticker.price ? `$${ticker.price.toFixed(2)}` : '--'"
                            ></span>
                            
                            <!-- 入场信号徽章（统一前缀，1 分钟自动消失，不闪烁） -->
                            <span
                                x-show="ticker.activeSignalBadge"
                                class="badge badge-signal"
                                :class="ticker.activeSignalBadge?.direction === 'bull' ? 'badge-signal-bull' : 'badge-signal-bear'"
                                x-text="ticker.activeSignalBadge?.label"
                                x-cloak
                            ></span>
                            <!-- 缩量整理状态标识（策略B 持续显示） -->
                            <span x-show="ticker.contracting" class="badge badge-contract" title="策略B：蓄力整理中">⚡ 整理</span>
                        </div>
                        <button
                            type="button"
                            @click.stop="removeTicker(ticker.symbol)"
                            class="btn-remove flex-shrink-0 relative z-10"
                            title="移除"
                        >
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 pointer-events-none">
                                <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>

                    <!-- 迷你图表 - K线 + 成交量 -->
                    <div class="mini-chart" @click.stop>
                        <div :id="'chart-kline-' + ticker.symbol" class="chart-container"></div>
                        <div class="chart-overlay" x-show="!ticker.hasData">
                            <span class="text-xs text-gray-600">LOADING...</span>
                        </div>
                    </div>


                </div>
            </template>
        </div>
    </main>

    <!-- 详情弹窗 -->
    <div
        x-show="detailTicker"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="modal-overlay"
        @click.self="hideDetail()"
    >
        <div class="modal-content" @click.stop>
            <template x-if="detailTicker">
                <div>
                    <!-- 弹窗头部 -->
                    <div class="modal-header">
                        <div class="flex items-center gap-4">
                            <h2 class="text-2xl font-bold" x-text="detailTicker.symbol"></h2>
                            <span
                                class="price-tag text-xl"
                                :class="detailTicker.priceChange >= 0 ? 'positive' : 'negative'"
                                x-text="detailTicker.price ? `$${detailTicker.price.toFixed(2)}` : '--'"
                            ></span>
                            <!-- H 策略档位选择（TODO P2.5，写 user_watchlist.gear + 热重建该票引擎） -->
                            <select
                                x-show="Object.keys(hGears).length"
                                :value="detailTicker.hGear || ''"
                                @change="setTickerGear(detailTicker.symbol, $event.target.value)"
                                class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs font-mono text-indigo-300 focus:border-indigo-500 outline-none"
                                title="H策略档位（gear）"
                            >
                                <option value="" disabled>档位</option>
                                <template x-for="g in Object.keys(hGears)" :key="g">
                                    <option :value="g" x-text="g"></option>

                            </template>
                        </div>
                        <span class="text-[11px] font-mono block mt-2" :class="gearMsg.startsWith('✓') ? 'text-emerald-400' : 'text-gray-500'" x-text="gearMsg"></span>
                    </div>
                </template>
            </div>

            <!-- 操作栏 -->
            <div class="px-5 py-4 border-t border-gray-800 bg-gray-900/40 shrink-0 flex items-center justify-between gap-3">
                <span class="text-[11px] font-mono" :class="strategyMsg.startsWith('✓') ? 'text-emerald-400' : 'text-gray-500'" x-text="strategyMsg"></span>
                <div class="flex gap-3">
                    <button
                        @click="resetStrategyParams(activeStrategyTab)"
                        class="px-4 py-2 border border-gray-700 text-gray-400 hover:bg-gray-800 hover:text-gray-200 transition-colors font-mono text-xs rounded"
                    >恢复默认</button>
                    <button
                        @click="saveStrategyParams(activeStrategyTab)"
                        class="px-5 py-2 bg-indigo-600/80 text-indigo-100 border border-indigo-500 hover:bg-indigo-600 transition-colors font-mono text-xs rounded"
                    >保存并生效</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 音效 -->
    <audio id="alert-sound-2" x-ref="alertAudio" preload="auto">
        <source src="/static/watcher/alert_2.wav" type="audio/wav">
    </audio>


</body>
</html>
